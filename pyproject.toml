[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kwja-mlx"
version = "0.1.0"
description = "KWJA Japanese morphological analyzer on Apple Silicon via MLX"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.20.0",
    "numpy",
    "safetensors",
    "sentencepiece",
    "transformers>=4.40",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
dev = ["pytest"]
